<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Deutschland Umfragen – Dark Mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090b10;
  --bg2: #0d1017;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-bright: rgba(255,255,255,0.15);
  --text: #e8eaf0;
  --text-muted: #5a6070;
  --text-dim: #8892a0;
  --accent: #4d9fff;
  --accent-glow: rgba(77,159,255,0.15);
  --green: #3ecf8e;
  --red: #f05c5c;
  --font-head: 'Syne', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

body { 
  margin:0;
  font-family: var(--font-head);
  background: var(--bg);
  color: var(--text);
  position:relative;
  overflow-x:hidden;
}

/* Subtle grid background */
body::after {
  content:"";
  position:fixed;
  inset:0;
  background-image: 
    linear-gradient(rgba(77,159,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,159,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}



/* Header */
h1 { 
  text-align:center;
  padding:2.5rem 1rem 0.4rem;
  margin:0;
  font-size: clamp(22px, 4vw, 38px);
  font-weight:800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff 40%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  z-index:1;
}

.newest-poll-date { 
  text-align:center;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size:12px;
  margin-bottom:2rem;
  letter-spacing:0.05em;
  position: relative;
  z-index:1;
}
.newest-poll-date::before {
  content: "● ";
  color: var(--green);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Badges */
.new-badge { 
  display:inline-block;
  background: linear-gradient(135deg, var(--green), #2ab875);
  color:#000;
  padding:3px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
  font-family: var(--font-mono);
  letter-spacing:0.05em;
  text-transform:uppercase;
  margin-top:8px;
}

/* Bundestag section */
.bundestag-section { 
  max-width:1400px;
  margin:0 auto 1.5rem;
  padding:0 1.5rem;
  position:relative;
  z-index:1;
}

.bundestag-container { 
  background: var(--surface);
  border-radius:16px;
  padding:1.5rem;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  backdrop-filter: blur(12px);
  transition: border-color 0.4s ease;
}
.bundestag-container:hover {
  border-color: var(--border-bright);
}
.bundestag-container::before { 
  content:"";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:300px;height:300px;
  background-image:url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Coat_of_arms_of_Germany.svg/960px-Coat_of_arms_of_Germany.svg.png');
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  opacity:0.04;
  pointer-events:none;
  z-index:0;
}
.bundestag-container h2 { 
  margin:0 0 0.3rem 0;
  font-size:15px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color: var(--text-dim);
  position:relative;
  z-index:1;
}
.bundestag-container .date { 
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size:12px;
  margin-bottom:1rem;
  position:relative;
  z-index:1;
}
.bundestag-container .badge-container { 
  position:relative;
  z-index:1;
  margin-top:1.2rem;
}

/* Main layout */
.main { 
  display:flex;
  max-width:1400px;
  margin:auto;
  gap:0;
  position:relative;
  z-index:1;
}

/* States grid */
.states { 
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0.8rem;
  padding:1.5rem;
  width:50%;
}
.state { 
  background: var(--surface);
  border-radius:12px;
  padding:0.9rem 0.6rem;
  text-align:center;
  cursor:pointer;
  transition:all 0.25s ease;
  border:1px solid var(--border);
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:130px;
  backdrop-filter: blur(8px);
  overflow:hidden;
}
.state::before {
  content:"";
  position:absolute;
  inset:0;
  background: linear-gradient(135deg, transparent 60%, rgba(77,159,255,0.05));
  opacity:0;
  transition: opacity 0.25s;
}
.state:hover { 
  background: var(--surface-hover);
  transform:translateY(-3px);
  border-color: var(--border-bright);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(77,159,255,0.1);
}
.state:hover::before { opacity:1; }
.state.active { 
  background: rgba(77,159,255,0.08);
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(77,159,255,0.15);
}
.state-content { flex:1;display:flex;flex-direction:column;justify-content:center }
.state img { width:56px;height:56px;object-fit:contain;margin:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)) }
.state-name { margin-top:0.5rem;font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim) }
.state .badge-container { margin-top:auto;padding-top:0.4rem }

/* Right panel */
.panel { 
  width:50%;
  padding:1.5rem;
  background: transparent;
  position:relative;
  overflow:hidden;
}
.panel::before { 
  content:"";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:350px;height:350px;
  background-image:var(--bg-coat);
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  opacity:0.05;
  pointer-events:none;
  transition:all 0.5s ease;
}
.panel h2 { 
  margin:0 0 0.2rem;
  font-size: clamp(18px, 2vw, 24px);
  font-weight:800;
  letter-spacing:-0.02em;
}
.panel .date { 
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size:12px;
  margin-bottom:1.5rem;
  letter-spacing:0.04em;
}

/* Bar rows */
.bar-row { 
  display:flex;
  align-items:center;
  gap:8px;
  margin:0.9rem 0;
  position:relative;
  z-index:1;
}
.party-logo { width:24px;height:24px;object-fit:contain;flex-shrink:0 }
.bar { 
  height:24px;
  border-radius:4px;
  display:flex;
  align-items:center;
  padding-left:8px;
  font-size:11px;
  font-weight:700;
  font-family: var(--font-mono);
  letter-spacing:0.03em;
  transition:width 0.3s ease;
  width:0;
  animation:none;
  position:relative;
  overflow:visible;
}
.bar::after {
  content:'';
  position:absolute;
  inset:0;
  border-radius:4px;
  background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
  pointer-events:none;
}
.bar.animate { animation:expandBar 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards }
@keyframes expandBar {
  from { width:0; opacity:0 }
  to { opacity:1 }
}
.bar:hover { opacity:0.85; }
.percent { 
  width:90px;
  text-align:right;
  font-weight:700;
  font-family: var(--font-mono);
  font-size:13px;
  flex-shrink:0;
}

/* History */
.history-section { 
  margin-top:2rem;
  padding-top:1.5rem;
  border-top:1px solid var(--border);
}
.history-section h3 { 
  font-size:11px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color: var(--text-muted);
  margin-bottom:1rem;
}
.history-row { 
  margin:1rem 0;
  padding:1rem;
  background: var(--surface);
  border-radius:10px;
  border:1px solid var(--border);
}
.history-date { 
  font-size:11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom:0.7rem;
  letter-spacing:0.04em;
}
.history-parties { display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:0.6rem }
.history-party { text-align:center }
.history-party-name { font-size:10px;color:var(--text-muted);margin-bottom:0.2rem;font-family:var(--font-mono);letter-spacing:0.04em }
.history-party-value { font-size:13px;font-weight:700;font-family:var(--font-mono) }

/* Trends */
.trend { display:inline-block;margin-left:5px;font-size:10px;font-weight:700;font-family:var(--font-mono) }
.trend.up { color: var(--green) }
.trend.down { color: var(--red) }
.trend.same { color: var(--text-muted) }

/* Elections scroll */
#elections-2026 { max-height:360px;overflow-y:auto;padding-right:6px }
#elections-2026::-webkit-scrollbar { width:4px }
#elections-2026::-webkit-scrollbar-track { background:transparent }
#elections-2026::-webkit-scrollbar-thumb { background:var(--border-bright);border-radius:2px }
#elections-2026::-webkit-scrollbar-thumb:hover { background:var(--accent) }

.election-item { 
  display:flex;align-items:center;gap:10px;
  margin:0.7rem 0;
  padding:0.8rem;
  background:var(--surface);
  border-radius:10px;
  border:1px solid var(--border);
  position:relative;z-index:1;
  flex-wrap:wrap;
  transition: border-color 0.2s;
}
.election-item:hover { border-color:var(--border-bright); }
.election-coat { width:36px;height:36px;object-fit:contain;flex-shrink:0 }
.election-info { flex:1;min-width:0 }
.election-state { font-weight:700;font-size:13px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.01em }
.election-type { font-size:10px;color:var(--text-muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em }
.election-date { font-size:11px;color:var(--accent);font-family:var(--font-mono);white-space:normal;flex-shrink:0;width:100%;margin-top:3px }

/* Seats button */
.seats-btn { 
  background: linear-gradient(135deg, rgba(77,159,255,0.15), rgba(77,159,255,0.08));
  color: var(--accent);
  border:1px solid rgba(77,159,255,0.3);
  padding:7px 16px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  font-family: var(--font-mono);
  letter-spacing:0.04em;
  text-transform:uppercase;
  cursor:pointer;
  margin-top:1rem;
  transition:all 0.25s ease;
  position:relative;z-index:1;
}
.seats-btn:hover { 
  background: rgba(77,159,255,0.2);
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(77,159,255,0.2);
  transform:translateY(-1px);
}

/* Modals */
.modal-overlay { 
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.88);
  backdrop-filter:blur(4px);
  z-index:1000;
  align-items:center;justify-content:center;
}
.modal-overlay.active { display:flex }
.modal-content { 
  background: #0d1117;
  border-radius:16px;
  width:90%;max-width:1200px;max-height:90vh;
  overflow:hidden;position:relative;
  border:1px solid var(--border-bright);
  box-shadow: 0 40px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(77,159,255,0.1);
}
.modal-header { 
  display:flex;justify-content:space-between;align-items:center;
  padding:1.2rem 1.5rem;
  border-bottom:1px solid var(--border);
  background: rgba(255,255,255,0.02);
}
.modal-header h2 { 
  margin:0;font-size:16px;font-weight:800;
  letter-spacing:0.04em;text-transform:uppercase;
  color:var(--text-dim);
}
.close-btn { 
  background: rgba(240,92,92,0.15);
  color: var(--red);
  border:1px solid rgba(240,92,92,0.3);
  padding:6px 14px;
  border-radius:7px;
  font-size:12px;font-weight:700;
  font-family: var(--font-mono);
  letter-spacing:0.04em;
  cursor:pointer;
  transition:all 0.2s ease;
}
.close-btn:hover { background:rgba(240,92,92,0.25); border-color:var(--red); }
.modal-body { 
  display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;
  padding:1.5rem;
  max-height:calc(90vh - 70px);
  overflow-y:auto;
}
.modal-section { 
  background:var(--surface);
  border-radius:12px;padding:1.2rem;
  border:1px solid var(--border);
}
.modal-section h3 { 
  margin:0 0 1rem 0;
  font-size:11px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--accent);
}
.seats-grid { display:flex;flex-wrap:wrap;gap:4px;margin-top:1rem;justify-content:center;align-items:flex-end;position:relative;min-height:300px }
.seat-dot { border-radius:50%;display:inline-block;position:absolute;transition:opacity 0.4s ease }
.parliament-container { width:100%;height:300px;position:relative }
.party-seat-info { 
  display:flex;align-items:center;gap:8px;
  margin:0.6rem 0;padding:0.5rem 0.7rem;
  background:rgba(255,255,255,0.03);
  border-radius:8px;border:1px solid var(--border);
}
.party-seat-logo { width:22px;height:22px;object-fit:contain }
.party-seat-name { flex:1;font-size:13px;font-weight:700 }
.party-seat-count { font-size:13px;font-weight:700;font-family:var(--font-mono);color:var(--accent) }

.coalition-party { 
  display:flex;align-items:center;gap:8px;
  padding:0.7rem;
  background:rgba(255,255,255,0.03);
  border-radius:8px;margin:0.4rem 0;
  cursor:pointer;
  transition:all 0.2s ease;
  border:1px solid var(--border);
}
.coalition-party:hover { background:var(--surface-hover); border-color:var(--border-bright); }
.coalition-party.selected { border-color:var(--green);background:rgba(62,207,142,0.08);box-shadow:0 0 12px rgba(62,207,142,0.1); }
.coalition-result { 
  margin-top:1rem;padding:0.8rem;border-radius:8px;
  text-align:center;font-size:14px;font-weight:700;
  font-family:var(--font-mono);letter-spacing:0.04em;
}
.coalition-result.majority { background:rgba(62,207,142,0.15);color:var(--green);border:1px solid rgba(62,207,142,0.3) }
.coalition-result.no-majority { background:rgba(240,92,92,0.15);color:var(--red);border:1px solid rgba(240,92,92,0.3) }
.coalition-stats { 
  display:flex;justify-content:space-around;
  margin-top:1rem;padding:0.8rem;
  background:rgba(255,255,255,0.03);border-radius:8px;
  border:1px solid var(--border);
}
.coalition-stat { text-align:center }
.coalition-stat-value { font-size:22px;font-weight:800;font-family:var(--font-mono);color:var(--accent) }
.coalition-stat-label { font-size:10px;color:var(--text-muted);margin-top:0.2rem;letter-spacing:0.06em;text-transform:uppercase }

/* State Data Modal for Mobile */
.state-modal-overlay { 
  display:none;position:fixed;inset:0;
  background:var(--bg);z-index:2000;overflow-y:auto;
}
.state-modal-overlay.active { display:block }
.state-modal-overlay::before { 
  content:"";position:fixed;
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:400px;height:400px;
  background-image:var(--bg-coat);
  background-size:contain;background-repeat:no-repeat;background-position:center;
  opacity:0.05;pointer-events:none;z-index:0;
}
.state-modal-header { 
  display:flex;justify-content:space-between;align-items:center;
  padding:1rem 1.2rem;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
  background:rgba(9,11,16,0.95);
  backdrop-filter:blur(12px);
  z-index:10;
}
.state-modal-header h2 { 
  margin:0;font-size:16px;font-weight:800;
  letter-spacing:-0.01em;
  position:relative;z-index:1;
}
.state-modal-header .close-btn { align-self:center;position:relative;z-index:1 }
.state-modal-body { padding:1.2rem;position:relative;z-index:1 }
.state-modal-body .date { color:var(--text-muted);font-family:var(--font-mono);font-size:12px;margin-bottom:1.2rem;letter-spacing:0.04em }

/* Mobile Optimizations */
@media screen and (max-width: 1024px) {
  .bundestag-section { padding:0 0.8rem }
  .bundestag-container { grid-template-columns:1fr !important }
  .main { flex-direction:column;gap:0 }
  .states { width:100%;padding:0.8rem;grid-template-columns:repeat(3,1fr);gap:0.7rem }
  .panel { width:100%;padding:1.2rem }
  .modal-body { grid-template-columns:1fr;gap:1rem;padding:1rem }
  .modal-content { width:95%;max-width:none }
}

@media screen and (max-width: 768px) {
  h1 { font-size:24px;padding:1.2rem 0.8rem 0.3rem }
  .bundestag-section { padding:0 0.5rem }
  .bundestag-container { padding:1rem }
  .bundestag-container h2 { font-size:12px }
  .states { grid-template-columns:repeat(2,1fr);gap:0.6rem;padding:0.6rem }
  .state { min-height:110px;padding:0.7rem }
  .state img { width:44px;height:44px }
  .state-name { font-size:10px }
  .panel { padding:1rem }
  .panel h2 { font-size:18px }
  .bar-row { gap:6px;margin:1rem 0 }
  .party-logo { width:20px;height:20px }
  .bar { height:20px;font-size:10px;padding-left:6px }
  .percent { width:70px;font-size:11px }
  .modal-header { padding:0.8rem 1rem }
  .modal-header h2 { font-size:13px }
  .modal-body { padding:0.8rem }
  .modal-section { padding:0.8rem }
  .seats-grid { min-height:180px }
  .coalition-stat-value { font-size:18px }
  .election-item { gap:8px;padding:0.6rem }
  .election-coat { width:30px;height:30px }
  .election-state { font-size:12px }
  .election-type { font-size:10px }
  .election-date { font-size:11px }
}

@media screen and (max-width: 480px) {
  h1 { font-size:18px;padding:1rem 0.5rem 0.2rem }
  .bundestag-section { margin-bottom:0.8rem }
  .states { grid-template-columns:repeat(2,1fr);gap:0.5rem;padding:0.5rem }
  .state { min-height:100px;padding:0.6rem }
  .state img { width:38px;height:38px }
  .state-name { font-size:9px }
  .panel { padding:0.7rem }
  .panel h2 { font-size:15px }
  .bar-row { margin:0.8rem 0 }
  .bar { height:18px;font-size:9px }
  .party-logo { width:18px;height:18px }
  .percent { width:58px;font-size:10px }
  .history-parties { grid-template-columns:repeat(auto-fit,minmax(55px,1fr)) }
  .modal-header { padding:0.7rem }
  .modal-header h2 { font-size:12px }
  .close-btn { padding:5px 10px;font-size:11px }
  .seats-btn { padding:5px 10px;font-size:10px }
  .coalition-party { padding:0.5rem;gap:6px }
  .party-seat-logo { width:18px;height:18px }
  .party-seat-name { font-size:11px }
  .party-seat-count { font-size:11px }
  .coalition-stat-value { font-size:16px }
  .coalition-stat-label { font-size:10px }
  .election-item { gap:6px;padding:0.5rem }
  .election-coat { width:26px;height:26px }
  .election-state { font-size:11px }
  .election-type { font-size:9px }
  .election-date { font-size:10px }
}

/* Hide desktop panel on mobile */
@media screen and (max-width: 1024px) {
  .panel { display: none !important; }
}

/* Weitere Umfragen Button */
.weitere-btn-container {
  display: flex;
  justify-content: center;
  padding: 0.5rem 2rem 2rem;
  position: relative;
  z-index: 1;
}
@media screen and (max-width: 1024px) {
  .weitere-btn-container {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    padding: 0.8rem 1rem;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    z-index: 500;
    box-sizing: border-box;
  }
  body { padding-bottom: 70px; }
}

.weitere-btn {
  background: linear-gradient(135deg, rgba(77,159,255,0.15), rgba(77,159,255,0.08));
  color: var(--accent);
  border: 1px solid rgba(77,159,255,0.35);
  padding: 11px 28px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 20px rgba(77,159,255,0.1);
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}
.weitere-btn:hover { 
  background: rgba(77,159,255,0.2);
  border-color: var(--accent);

let currentState = null;

function parseDate(dateStr) {
  // Parse DD.MM.YYYY format
  const parts = dateStr.split('.');
  if(parts.length !== 3 || dateStr.includes('X')) return null;
  return new Date(parts[2], parts[1] - 1, parts[0]);
}

function findNewestPoll() {
  let newestDate = null;
  let newestLocation = null;
  let newestIsBundestag = false;
  
  // Check Bundestag
  const bundestagDate = parseDate(bundestagData.date);
  if(bundestagDate) {
    newestDate = bundestagDate;
    newestLocation = 'Bundestag';
    newestIsBundestag = true;
  }
  
  // Check all Landtag states
  Object.entries(data).forEach(([state, stateData]) => {
    const stateDate = parseDate(stateData.date);
    if(stateDate && (!newestDate || stateDate > newestDate)) {
      newestDate = stateDate;
      newestLocation = state;
      newestIsBundestag = false;
    }
  });
  
  return { 
    date: newestDate, 
    location: newestLocation, 
    isBundestag: newestIsBundestag,
    dateString: formatDate(newestDate)
  };
}

function getLeadingParty(results) {
  let maxPercent = 0;
  let leadingParty = null;
  Object.entries(results).forEach(([party, percent]) => {
    if(percent > maxPercent) {
      maxPercent = percent;
      leadingParty = party;
    }
  });
  return leadingParty;
}

function formatDate(date) {
  const day = String(date.getDate()).padStart(2, '0');
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const year = date.getFullYear();
  return `${day}.${month}.${year}`;
}

function buildStates(){
  const newest = findNewestPoll();
  const c=document.getElementById("states");
  
  // Sort states by date (newest first)
  const sortedStates = Object.keys(data).sort((a, b) => {
    const dateA = parseDate(data[a].date);
    const dateB = parseDate(data[b].date);
    return dateB - dateA; // Descending order (newest first)
  });
  
  sortedStates.forEach(s=>{
    const d=document.createElement("div");
    d.className="state";
    
    // Touch/Click detection to prevent opening while scrolling
    let touchStartY = 0;
    let touchEndY = 0;
    let touchStartTime = 0;
    
    d.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });
    
    d.addEventListener('touchend', (e) => {
      touchEndY = e.changedTouches[0].clientY;
      const touchDuration = Date.now() - touchStartTime;
      const touchDistance = Math.abs(touchEndY - touchStartY);
      
      // Only trigger if it was a tap (not a scroll)
      // Max 10px movement and max 300ms duration
      if (touchDistance < 10 && touchDuration < 300) {
        showState(s);
      }
    });
    
    // Desktop click
    d.addEventListener('click', (e) => {
      // Only for non-touch devices
      if (!('ontouchstart' in window)) {
        showState(s);
      }
    });
    
    // Get leading party and set border color
    const leadingParty = getLeadingParty(data[s].results);
    d.style.borderColor = colors[leadingParty] || 'transparent';
    
    // Create content container
    const contentDiv = document.createElement("div");
    contentDiv.className = "state-content";
    
    const img=document.createElement("img");
    img.src=stateCoats[s];
    img.alt=s+" Wappen";
    const name=document.createElement("div");
    name.className="state-name";
    name.textContent=s;
    
    contentDiv.appendChild(img);
    contentDiv.appendChild(name);
    d.appendChild(contentDiv);
    
    // Add "Neue Umfrage" badge at bottom if this has the newest date
    // Always show badge for election states, or if newest poll
    if(data[s].isElection === true || data[s].date === newest.dateString) {
      const badgeContainer = document.createElement("div");
      badgeContainer.className = "badge-container";
      const badge = document.createElement("span");
      badge.className = "new-badge";
      badge.textContent = data[s].isElection === true ? "Ergebnis" : "Neue Umfrage";
      if(data[s].isElection === true) badge.style.background = "#4f7fa8";
      badgeContainer.appendChild(badge);
      d.appendChild(badgeContainer);
    }
    
    c.appendChild(d);
  });
}

function showState(state){
  // Check if mobile (screen width <= 1024px)
  const isMobile = window.innerWidth <= 1024;
  
  if(isMobile) {
    // Mobile: Open modal instead
    openStateModal(state);
    return;
  }
  
  // Desktop: Original behavior
  // Update active state
  if(currentState) {
    const prevStates = document.querySelectorAll('.state');
    prevStates.forEach(s => s.classList.remove('active'));
  }
  currentState = state;
  const states = document.querySelectorAll('.state');
  states.forEach((s) => {
    // Check if this state div's text matches the current state
    const stateName = s.querySelector('.state-name').textContent;
    if(stateName === state) {
      s.classList.add('active');
    }
  });

  // Update background coat of arms
  const panel = document.querySelector('.panel');
  panel.style.setProperty('--bg-coat', `url(${stateCoats[state]})`);

  const bars=document.getElementById("bars");
  bars.innerHTML="";
  const isElection = data[state].isElection === true;
  document.getElementById("title").innerText = state + (isElection ? ' \u2013 Ergebnis' : '');
  document.getElementById("date").innerText = (isElection ? 'Ergebnis: ' : 'Stand: ') + data[state].date;
  
  // Calculate trends: use lastElection if isElection=true, else history[0]
  const currentResults = data[state].results;
  const le = data[state].lastElection;
  const previousResults = (isElection && le && Object.keys(le.results||{}).length > 0)
    ? le.results
    : (data[state].history[0] ? data[state].history[0].results : {});
  
  let entries=Object.entries(currentResults).sort((a,b)=>{
    // Always put Sonstige last
    if(a[0] === 'Sonstige') return 1;
    if(b[0] === 'Sonstige') return -1;
    // Sort others by percentage descending
    return b[1]-a[1];
  });
  entries.forEach(([p,v], index)=>{
    if(v === 0) return;
    const r=document.createElement("div");
    r.className="bar-row";
    
    const logo=document.createElement("img");
    logo.src=logos[p];
    logo.className="party-logo";
    logo.alt=p+" Logo";
    
    const b=document.createElement("div");
    b.className="bar";
    // Responsive scaling based on screen width
    const screenWidth = window.innerWidth;
    let scaleFactor;
    
    if (screenWidth <= 480) {
      // Very small phones: 5px per %
      scaleFactor = 5;
    } else if (screenWidth <= 768) {
      // Small tablets/large phones: 8px per %
      scaleFactor = 8;
    } else {
      // Desktop: 15px per %
      scaleFactor = 15;
    }
    
    // Pure proportional scaling - no minimum to show true differences
    const targetWidth = v > 0 ? (v * scaleFactor) + "px" : "0px";
    b.style.background=colors[p];
    b.style.color = (p==="FDP" ? "#000" : "#fff");
    b.textContent = p;
    
    // Calculate exact percentage difference
    const prevValue = previousResults[p] || 0;
    const diff = v - prevValue;
    let trendText = '';
    let trendClass = 'same';
    
    if(diff > 0) { 
      trendText = '+' + diff.toFixed(1) + '%'; 
      trendClass = 'up'; 
    } else if(diff < 0) { 
      trendText = diff.toFixed(1) + '%'; 
      trendClass = 'down'; 
    } else {
      trendText = '±0%';
    }
    
    // Trigger animation with delay
    setTimeout(() => {
      b.classList.add('animate');
      b.style.width = targetWidth;
    }, index * 100);
    
    const pc=document.createElement("div");
    pc.className="percent";
    const trendTitle = isElection ? 'Veraenderung zur letzten Wahl' : '';
    pc.innerHTML = v+'% <span class="trend '+trendClass+'" title="'+trendTitle+'">'+trendText+'</span>';
    
    r.appendChild(logo);
    r.appendChild(b);
    r.appendChild(pc);
    bars.appendChild(r);
  });

  // Show change label when isElection
  if(isElection) {
    const changeLabel = document.createElement("div");
    changeLabel.style.cssText = "font-size:11px;color:#888;margin-bottom:0.5rem;margin-top:-0.3rem;text-align:right;padding-right:4px;";
    changeLabel.textContent = "± Veränderung zur letzten Wahl";
    bars.insertBefore(changeLabel, bars.firstChild);
  }
  
  // Add seats button after bars
  const seatsBtn = document.createElement("button");
  seatsBtn.className = "seats-btn";
  seatsBtn.textContent = "Sitzverteilung/Koalitionen";
  seatsBtn.onclick = () => openSeatsModal(state, currentResults);
  bars.appendChild(seatsBtn);
  
  // Display historical data
  const historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "";
  
  // Update history heading
  const historyHeading = document.querySelector('.panel .history-section h3');
  if(historyHeading) historyHeading.textContent = 'Frühere Umfragen';



  data[state].history.forEach(h => {
    const row = document.createElement("div");
    row.className = "history-row";
    
    const dateDiv = document.createElement("div");
    dateDiv.className = "history-date";
    dateDiv.textContent = h.date;
    row.appendChild(dateDiv);
    
    const partiesDiv = document.createElement("div");
    partiesDiv.className = "history-parties";
    
    // Sort parties by their historical percentages, but always put Sonstige last
    const historicalEntries = Object.entries(h.results).sort((a,b)=>{
      // Always put Sonstige last
      if(a[0] === 'Sonstige') return 1;
      if(b[0] === 'Sonstige') return -1;
      // Sort others by percentage descending
      return b[1]-a[1];
    });
    historicalEntries.forEach(([p, v]) => {
      if(v > 0) {
        const partyDiv = document.createElement("div");
        partyDiv.className = "history-party";
        
        const nameDiv = document.createElement("div");
        nameDiv.className = "history-party-name";
        nameDiv.textContent = p;
        
        const valueDiv = document.createElement("div");
        valueDiv.className = "history-party-value";
        valueDiv.textContent = v + "%";
        
        partyDiv.appendChild(nameDiv);
        partyDiv.appendChild(valueDiv);
        partiesDiv.appendChild(partyDiv);
      }
    });
    
    row.appendChild(partiesDiv);
    historyDiv.appendChild(row);
  });
}

// Seat distribution and coalition calculator functions
function calculateSeats(results, totalSeats) {
  // Filter parties: exclude Sonstige and parties below 5%
  const eligibleParties = {};
  
  Object.entries(results).forEach(([party, percent]) => {
    if(party !== 'Sonstige' && percent >= 5) {
      eligibleParties[party] = percent;
    }
  });
  
  // Sainte-Laguë/Schepers method (used in Germany)
  const seats = {};
  Object.keys(eligibleParties).forEach(party => seats[party] = 0);
  
  // Allocate seats one by one
  for(let i = 0; i < totalSeats; i++) {
    let maxQuotient = 0;
    let maxParty = null;
    
    Object.entries(eligibleParties).forEach(([party, percent]) => {
      // Quotient = votes / (2 * seats + 1)
      const quotient = percent / (2 * seats[party] + 1);
      if(quotient > maxQuotient) {
        maxQuotient = quotient;
        maxParty = party;
      }
    });
    
    if(maxParty) {
      seats[maxParty]++;
    }
  }
  
  return seats;
}

function renderSeatDistribution(seats, totalSeats) {
  const listDiv = document.getElementById('seatsList');
  const gridDiv = document.getElementById('seatsGrid');
  
  listDiv.innerHTML = '';
  gridDiv.innerHTML = '';
  
  // Calculate dynamic dot size and spacing based on total seats
  let dotSize = 8;
  let spacing = 1;
  
  // Mobile adjustments
  const screenWidth = window.innerWidth;
  const isMobileView = screenWidth < 768;
  
  if(isMobileView) {
    // Smaller dots on mobile
    if(totalSeats < 100) {
      dotSize = 8;
      spacing = 1.2;
    } else if(totalSeats < 150) {
      dotSize = 6;
      spacing = 1;
    } else if(totalSeats < 200) {
      dotSize = 5;
      spacing = 0.8;
    } else {
      dotSize = 4;
      spacing = 0.8;
    }
  } else {
    // Desktop sizes
    if(totalSeats < 100) {
      dotSize = 12;
      spacing = 1.5;
    } else if(totalSeats < 150) {
      dotSize = 10;
      spacing = 1.5;
    } else if(totalSeats < 200) {
      dotSize = 8;
      spacing = 1.2;
    } else {
      dotSize = 7;
      spacing = 1;
    }
  }
  
  // Political spectrum order: left to right
  // Linke → BSW → Grüne → SPD → FDP → CDU/CSU → AfD
  const politicalOrder = ['Linke', 'BSW', 'Grüne', 'SPD', 'FDP', 'CDU', 'CDU/CSU', 'CSU', 'FW', 'AfD'];
  
  // Sort parties by political spectrum
  const sortedSeats = Object.entries(seats).sort((a, b) => {
    const indexA = politicalOrder.indexOf(a[0]);
    const indexB = politicalOrder.indexOf(b[0]);
    const posA = indexA === -1 ? 999 : indexA;
    const posB = indexB === -1 ? 999 : indexB;
    return posA - posB;
  });
  
  // Render party list (sorted by seat count)
  const sortedByCount = Object.entries(seats).sort((a, b) => b[1] - a[1]);
  sortedByCount.forEach(([party, count]) => {
    const info = document.createElement('div');
    info.className = 'party-seat-info';
    
    const logo = document.createElement('img');
    logo.src = logos[party];
    logo.className = 'party-seat-logo';
    logo.alt = party;
    
    const name = document.createElement('div');
    name.className = 'party-seat-name';
    name.textContent = party;
    
    const countDiv = document.createElement('div');
    countDiv.className = 'party-seat-count';
    countDiv.textContent = count + ' Sitze';
    
    info.appendChild(logo);
    info.appendChild(name);
    info.appendChild(countDiv);
    listDiv.appendChild(info);
  });
  
  // Render parliament semicircle
  // Responsive container size
  const containerWidth = isMobileView ? Math.min(screenWidth - 40, 400) : 560;
  const containerHeight = isMobileView ? Math.min(containerWidth * 0.6, 250) : 300;
  gridDiv.style.width = containerWidth + 'px';
  gridDiv.style.height = containerHeight + 'px';
  gridDiv.style.position = 'relative';
  gridDiv.style.margin = '0 auto';
  
  // Parliament layout parameters - optimized for much tighter spacing
  const numRows = totalSeats < 80 ? 4 : (totalSeats < 120 ? 5 : (totalSeats < 200 ? 6 : 7));
  const baseRadius = totalSeats < 100 ? 40 : (totalSeats < 200 ? 50 : 60);
  const maxRadius = containerWidth / 2 - 20;
  const radiusIncrement = (maxRadius - baseRadius) / Math.max(1, numRows - 1);
  
  // Calculate seats per row based on circumference and dot size
  const seatsPerRow = [];
  let totalCalculated = 0;
  for(let row = 0; row < numRows; row++) {
    const radius = baseRadius + row * radiusIncrement;
    const circumference = Math.PI * radius;
    const seatsInRow = Math.max(3, Math.floor(circumference / (dotSize + spacing)));
    seatsPerRow.push(seatsInRow);
    totalCalculated += seatsInRow;
  }
  
  // Adjust to match exact total seats
  const ratio = totalSeats / totalCalculated;
  for(let i = 0; i < seatsPerRow.length; i++) {
    seatsPerRow[i] = Math.round(seatsPerRow[i] * ratio);
  }
  
  // Fine-tune to exact total
  let currentTotal = seatsPerRow.reduce((a, b) => a + b, 0);
  while(currentTotal < totalSeats) {
    // Add to row with most seats
    const maxRowIndex = seatsPerRow.indexOf(Math.max(...seatsPerRow));
    seatsPerRow[maxRowIndex]++;
    currentTotal++;
  }
  while(currentTotal > totalSeats) {
    // Remove from row with most seats
    const maxRowIndex = seatsPerRow.indexOf(Math.max(...seatsPerRow));
    if(seatsPerRow[maxRowIndex] > 1) {
      seatsPerRow[maxRowIndex]--;
      currentTotal--;
    } else break;
  }
  
  // Create all seat positions first, then assign parties
  const allPositions = [];
  const centerX = containerWidth / 2;
  const centerY = containerHeight - 20;
  
  for(let row = 0; row < numRows; row++) {
    const radius = baseRadius + row * radiusIncrement;
    const seatsInThisRow = seatsPerRow[row];
    
    for(let posInRow = 0; posInRow < seatsInThisRow; posInRow++) {
      const angle = Math.PI * (posInRow / (seatsInThisRow - 1 || 1));
      const x = centerX - radius * Math.cos(angle);
      const y = centerY - radius * Math.sin(angle);
      
      // Calculate horizontal position for sorting (left to right)
      allPositions.push({ x, y, angle, row });
    }
  }
  
  // Sort all positions by angle (left to right in parliament)
  allPositions.sort((a, b) => a.angle - b.angle);
  
  // Assign parties to positions in political order
  let posIndex = 0;
  sortedSeats.forEach(([party, count]) => {
    for(let i = 0; i < count && posIndex < allPositions.length; i++) {
      const pos = allPositions[posIndex];
      
      const dot = document.createElement('div');
      dot.className = 'seat-dot';
      dot.style.width = dotSize + 'px';
      dot.style.height = dotSize + 'px';
      dot.style.background = colors[party];
      dot.style.left = (pos.x - dotSize / 2) + 'px';
      dot.style.top = (pos.y - dotSize / 2) + 'px';
      dot.title = party;
      dot.dataset.party = party;
      
      // Set opacity based on coalition selection
      if(selectedCoalition.length > 0) {
        dot.style.opacity = selectedCoalition.includes(party) ? '1' : '0.15';
      } else {
        dot.style.opacity = '1';
      }
      
      gridDiv.appendChild(dot);
      posIndex++;
    }
  });
}

function renderCoalitionCalculator(seats, totalSeats) {
  const partiesDiv = document.getElementById('coalitionParties');
  partiesDiv.innerHTML = '';
  
  const sortedSeats = Object.entries(seats).sort((a, b) => b[1] - a[1]);
  
  sortedSeats.forEach(([party, count]) => {
    const partyDiv = document.createElement('div');
    partyDiv.className = 'coalition-party';
    partyDiv.onclick = () => toggleCoalitionParty(party);
    
    const logo = document.createElement('img');
    logo.src = logos[party];
    logo.className = 'party-seat-logo';
    logo.alt = party;
    
    const name = document.createElement('div');
    name.className = 'party-seat-name';
    name.textContent = party;
    
    const countDiv = document.createElement('div');
    countDiv.className = 'party-seat-count';
    countDiv.textContent = count + ' Sitze';
    
    partyDiv.appendChild(logo);
    partyDiv.appendChild(name);
    partyDiv.appendChild(countDiv);
    partiesDiv.appendChild(partyDiv);
  });
  
  updateCoalitionResult();
}

function toggleCoalitionParty(party) {
  const index = selectedCoalition.indexOf(party);
  if(index > -1) {
    selectedCoalition.splice(index, 1);
  } else {
    selectedCoalition.push(party);
  }
  
  // Update UI
  const partyDivs = document.querySelectorAll('.coalition-party');
  partyDivs.forEach(div => {
    const partyName = div.querySelector('.party-seat-name').textContent;
    if(selectedCoalition.includes(partyName)) {
      div.classList.add('selected');
    } else {
      div.classList.remove('selected');
    }
  });
  
  updateCoalitionResult();
}

function updateCoalitionResult() {
  if(!currentSeatsData) return;
  
  const { seats, totalSeats } = currentSeatsData;
  const coalitionSeats = selectedCoalition.reduce((sum, party) => sum + (seats[party] || 0), 0);
  const requiredSeats = Math.ceil(totalSeats / 2);
  const hasMajority = coalitionSeats >= requiredSeats;
  
  // Update opacity of existing seat dots without re-rendering
  const allDots = document.querySelectorAll('.seat-dot');
  allDots.forEach(dot => {
    const party = dot.dataset.party;
    if(selectedCoalition.length > 0) {
      dot.style.opacity = selectedCoalition.includes(party) ? '1' : '0.15';
    } else {
      dot.style.opacity = '1';
    }
  });
  
  // Update stats
  const statsDiv = document.getElementById('coalitionStats');
  statsDiv.innerHTML = `
    <div class="coalition-stat">
      <div class="coalition-stat-value">${coalitionSeats}</div>
      <div class="coalition-stat-label">Sitze</div>
    </div>
    <div class="coalition-stat">
      <div class="coalition-stat-value">${requiredSeats}</div>
      <div class="coalition-stat-label">Benötigt</div>
    </div>
    <div class="coalition-stat">
      <div class="coalition-stat-value">${((coalitionSeats / totalSeats) * 100).toFixed(1)}%</div>
      <div class="coalition-stat-label">Anteil</div>
    </div>
  `;
  
  // Update result
  const resultDiv = document.getElementById('coalitionResult');
  if(selectedCoalition.length === 0) {
    resultDiv.innerHTML = 'Wählen Sie Parteien für eine Koalition aus';
    resultDiv.className = 'coalition-result';
  } else if(hasMajority) {
    resultDiv.innerHTML = '✓ Mehrheit erreicht';
    resultDiv.className = 'coalition-result majority';
  } else {
    resultDiv.innerHTML = '✗ Keine Mehrheit';
    resultDiv.className = 'coalition-result no-majority';
  }
}

    card.addEventListener('click', () => {
      if (!('ontouchstart' in window)) showCityStats(city);
    });
    card.innerHTML = `
      <img src="${cd.logo}" alt="${city} Wappen">
      <div class="city-card-name">${city}</div>
      <div class="city-card-date">Stand: ${cd.date}</div>
      ${cd.isNew ? '<span class="new-badge" style="margin-top:4px">Neue Umfrage</span>' : ''}
    `;
    grid.appendChild(card);
  });
}

function showCityStats(city) {
  const cd = cityData[city];
  document.getElementById('cityGrid').style.display = 'none';
  document.getElementById('cityStats').classList.add('active');
  document.getElementById('weitereTitle').textContent = '🏙️ ' + city;
  document.getElementById('cityStatsLogo').src = cd.logo;
  document.getElementById('cityStatsName').textContent = city;
  document.getElementById('cityStatsDate').textContent = 'Stand: ' + cd.date;
  const barsDiv = document.getElementById('cityStatsBars');
  barsDiv.innerHTML = '';
  const entries = Object.entries(cd.results).sort((a, b) => {
    if (a[0] === 'Sonstige') return 1;
    if (b[0] === 'Sonstige') return -1;
    return b[1] - a[1];
  });
  const prevResults = cd.history[0] ? cd.history[0].results : {};
  entries.forEach(([party, val], idx) => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    const logoEl = document.createElement('img');
    logoEl.className = 'party-logo';
    logoEl.alt = party;
    logoEl.src = (typeof logos !== 'undefined' && logos[party]) || '';
    const bar = document.createElement('div');
    bar.className = 'bar';
    const scaleFactor = window.innerWidth <= 480 ? 5 : window.innerWidth <= 768 ? 7 : 12;
    const col = cityColors[party] || '#666';
    bar.style.background = col;
    bar.style.color = (party === 'FDP') ? '#000' : '#fff';
    bar.textContent = party;
    const diff = val - (prevResults[party] || 0);
    const trendText = diff > 0 ? '+' + diff.toFixed(1) + '%' : diff < 0 ? diff.toFixed(1) + '%' : '±0%';
    const trendClass = diff > 0 ? 'up' : diff < 0 ? 'down' : 'same';
    setTimeout(() => { bar.classList.add('animate'); bar.style.width = val > 0 ? (val * scaleFactor) + 'px' : '0px'; }, idx * 80);
    const pct = document.createElement('div');
    pct.className = 'percent';
    pct.innerHTML = val + '% <span class="trend ' + trendClass + '">' + trendText + '</span>';
    row.appendChild(logoEl);
    row.appendChild(bar);
    row.appendChild(pct);
    barsDiv.appendChild(row);
  });
  const histDiv = document.getElementById('cityStatsHistory');
  histDiv.innerHTML = '';
  cd.history.forEach(h => {
    const row = document.createElement('div');
    row.className = 'history-row';
    const dateDiv = document.createElement('div');
    dateDiv.className = 'history-date';
    dateDiv.textContent = h.date;
    row.appendChild(dateDiv);
    const partiesDiv = document.createElement('div');
    partiesDiv.className = 'history-parties';
    Object.entries(h.results).sort((a,b) => {
      if(a[0]==='Sonstige') return 1;
      if(b[0]==='Sonstige') return -1;
      return b[1]-a[1];
    }).forEach(([p, pct]) => {
      if(pct > 0) {
        const pd = document.createElement('div');
        pd.className = 'history-party';
        pd.innerHTML = '<div class="history-party-name">' + p + '</div><div class="history-party-value" style="color:' + (cityColors[p]||'#aaa') + '">' + pct + '%</div>';
        partiesDiv.appendChild(pd);
      }
    });
    row.appendChild(partiesDiv);
    histDiv.appendChild(row);
  });
  document.getElementById('weitereBody').scrollTop = 0;
}

document.getElementById('weitereOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeWeitere();
});

</script>
